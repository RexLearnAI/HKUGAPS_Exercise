<!doctype html>
<html lang="zh-HK">
<head>

<title>一年級溫習室</title>

<style>
:root{--bg:#f3f6f4;--paper:#fff;--ink:#1f2a27;--muted:#5d6b66;--line:#c9d4cf;--accent:#1c7a63;--accent-soft:#e1f1ea;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC",serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141b19;--paper:#1d2624;--ink:#e7eeeb;--muted:#9aa9a3;--line:#3a4a45;--accent:#5cc7a6;--accent-soft:#1f3a32;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-size:2rem;margin:0}
h2{font-family:var(--f-display);font-size:1.3rem;margin:8px 0 0}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.card{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.code{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:4px;align-self:flex-start}
.t{font-family:var(--f-display);font-size:1.2rem}
.d{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <h2>數學</h2>

    <li><a class="card" href="maths/counting-4-1c.html"><span class="code">1上B · WS 4.1c</span><span class="t">數數方法：每 2 個、每 5 個、每 10 個一數</span><span class="d">練習卷（約 20 分鐘）＋ 模擬測驗（30 分鐘）</span></a></li>
